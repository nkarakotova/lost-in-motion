worker_processes 1;

events {
    worker_connections 1024;
}

http {

    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=all:64m inactive=2h max_size=2g;

    upstream balanced_backend {
        server localhost:8081 weight=2;
        server localhost:8082;
        server localhost:8083;
    }

    error_log  ./error.log;
    access_log ./access.log;

    server {

        listen 8080;
        server_name lim;

        listen 8443 quic reuseport;
        listen 8443 ssl;

        http2 on;
        http3 on;

        quic_gso on;
        quic_retry on;
        ssl_protocols TLSv1.2 TLSv1.3;

        ssl_certificate /opt/homebrew/etc/nginx/localhost.crt;
        ssl_certificate_key /opt/homebrew/etc/nginx/localhost.key;

        add_header Alt-Svc 'h3=":8443"; ma=864000';

        gzip_types text/plain text/css image/svg image/jpeg image/svg+xml application/json;
        gzip on;

        proxy_cache all;
        proxy_cache_methods GET;
        add_header X-Cache-Status $upstream_cache_status;
        proxy_cache_valid 200 1m;

        set $no_cache 0;
        if ($request_uri ~* "^/api/") {
            set $no_cache 1;
        }
        proxy_cache_bypass $no_cache;
        proxy_no_cache $no_cache;

        add_header Server "$server_name";

        # add_header Access-Control-Allow-Origin *;

        proxy_pass_request_headers on;
        underscores_in_headers on;

        location / {
            alias  /Users/natali/Desktop/miu/sem_7/web/web-karakotova-73/static/;
            add_header Link "<img/cite_1.png>; rel=preload; as=image";
            index index.html;
        }

        location /test {
            alias  /Users/natali/Desktop/miu/sem_7/web/web-karakotova-73/static/;
            index index.html;
        }

        location /swagger.json {
            proxy_pass http://localhost:8081/swagger.json;
        }

        location = /mirror1/api/v1/ {
            proxy_pass http://127.0.0.1:8084/api/v1/docs;
        }

        location ~* /mirror1/(.*) {
            proxy_pass http://127.0.0.1:8084/$1;
        }

        location = /api/v1/ {
            proxy_pass http://localhost:8081/api/v1/docs;
        }

        location /api/v1/ {
            limit_except GET {
                proxy_pass http://localhost:8081;
            }
            proxy_pass http://balanced_backend;
        }

        location /legacy {
            return 301 https://github.com/nkarakotova/lost_in_motion;
        }

        location /documentation {
            alias /Users/natali/Desktop/miu/sem_7/web/web-karakotova-73/static/;
            index README.html;  
        }

        location /admin {
            return 301 http://localhost:5435;
        }

        location /status {
            stub_status on;
        }
    }
}
