version: "3.9"

services:

  lim-backend:
    container_name: lim-backend
    build:
      context: .
      dockerfile: Dockerfile
    command: /app/lim-rest-api --host 0.0.0.0 --port 8080
    ports:
      - "8081:8080"
    volumes:
      - ./info.log:/app/info.log
      - ./lim/cmd/app/config.json:/app/cmd/app/config.json
    depends_on:
      - postgres-master
    networks:
      - limnet

  lim-backend-ro1:
    container_name: lim-backend-ro1
    build:
      context: .
      dockerfile: Dockerfile
    command: /app/lim-rest-api --host 0.0.0.0 --port 8080
    ports:
      - "8082:8080"
    volumes:
      - ./info-ro1.log:/app/info.log
      - ./lim/cmd/app/config-ro.json:/app/cmd/app/config.json
    depends_on:
      - postgres-slave
    networks:
      - limnet

  lim-backend-ro2:
    container_name: lim-backend-ro2
    build:
      context: .
      dockerfile: Dockerfile
    command: /app/lim-rest-api --host 0.0.0.0 --port 8080
    ports:
      - "8083:8080"
    volumes:
      - ./info-ro2.log:/app/info.log
      - ./lim/cmd/app/config-ro.json:/app/cmd/app/config.json
    depends_on:
      - postgres-slave
    networks:
      - limnet

  lim-backend-mirror:
    container_name: lim-backend-mirror
    build:
      context: .
      dockerfile: Dockerfile
    command: /app/lim-rest-api --host 0.0.0.0 --port 8080
    ports:
      - "8084:8080"
    volumes:
      - ./info-mirror.log:/app/info.log
      - ./lim/cmd/app/config.json:/app/cmd/app/config.json
    depends_on:
      - postgres-master
    networks:
      - limnet

  postgres-master:
    container_name: postgres-master
    restart: always
    image: postgres:16
    environment:
      POSTGRES_DB: "postgres"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "12345"
    ports:
      - "15432:5432"
    volumes:
      - ./lim/database/postgreSQL/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./lim/database/postgreSQL/test.sql:/docker-entrypoint-initdb.d/02_test.sql
      - pg-data:/var/lib/postgresql/data
    networks:
      - limnet

  postgres-slave:
    container_name: postgres-slave
    restart: always
    image: postgres:16
    depends_on:
      - postgres-master
    environment:
      POSTGRES_DB: "postgres"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "12345"
    ports:
      - "15433:5432"
    networks:
      - limnet

  lim-streamlit:
    container_name: lim-streamlit
    build:
      context: ./lim-streamlit
    ports:
      - "8501:8501"
    depends_on:
      - lim-analytics
    networks:
      - limnet

  lim-analytics:
    container_name: lim-analytics
    build:
      context: ./lim-analytics
    ports:
      - "8090:8000"
    environment:
      DB_HOST: postgres-master
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: "12345"
      DB_PORT: "5432"
    depends_on:
      - postgres-master
    networks:
      - limnet

  pgadmin:
    image: dpage/pgadmin4:7
    env_file:
      - .env
    ports: 
      - 5435:80
    volumes:
      - ./pgadmin:/var/lib/pgadmin
    environment: 
      TZ: "Europe/Moscow"
    depends_on:
      - postgres-master
    networks:
      - limnet

networks:
  limnet:
    driver: bridge

volumes:
  pg-data:
